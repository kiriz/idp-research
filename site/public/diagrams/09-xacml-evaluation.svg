  <text font-family="monospace" font-size="14" fill="rgba(28,40,51,1.00)" text-anchor="start"><tspan x="920.00" y="634.00">Decision Types:</tspan><tspan x="920.00" y="650.80">  Permit - Access granted</tspan><tspan x="920.00" y="667.60">  Deny - Access denied</tspan><tspan x="920.00" y="684.40">  NotApplicable - No policy matches</tspan><tspan x="920.00" y="701.20">  Indeterminate - Evaluation error</tspan></text>
