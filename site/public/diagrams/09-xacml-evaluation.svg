  <text font-family="monospace" font-size="16" fill="rgba(28,40,51,1.00)" text-anchor="middle"><tspan x="710.00" y="410.00">PDP</tspan><tspan x="710.00" y="429.20">Policy Decision Point</tspan><tspan x="710.00" y="448.40"></tspan><tspan x="710.00" y="467.60">Evaluates policies</tspan><tspan x="710.00" y="486.80">against request context</tspan><tspan x="710.00" y="506.00"></tspan><tspan x="710.00" y="525.20">Combining algorithms:</tspan><tspan x="710.00" y="544.40">deny-overrides,</tspan><tspan x="710.00" y="563.60">permit-overrides,</tspan><tspan x="710.00" y="582.80">first-applicable</tspan></text>
