  <text font-family="sans-serif" font-size="36" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="960.00" y="86.00">SPIFFE/SPIRE Workload Identity Architecture</tspan></text>
  <text font-family="sans-serif" font-size="20" fill="rgba(26,82,118,1.00)" text-anchor="start"><tspan x="210.00" y="150.00">SPIRE Server</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(26,82,118,1.00)" text-anchor="start"><tspan x="260.00" y="196.00">Node Attestor</tspan><tspan x="260.00" y="216.00"></tspan><tspan x="260.00" y="236.00">Verifies node identity</tspan><tspan x="260.00" y="256.00">(AWS IID, GCP, K8s, TPM)</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(26,82,118,1.00)" text-anchor="start"><tspan x="660.00" y="196.00">Registration API</tspan><tspan x="660.00" y="216.00"></tspan><tspan x="660.00" y="236.00">Workload registration</tspan><tspan x="660.00" y="256.00">entries</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(26,82,118,1.00)" text-anchor="start"><tspan x="1060.00" y="196.00">CA (Certificate Authority)</tspan><tspan x="1060.00" y="216.00"></tspan><tspan x="1060.00" y="236.00">Issues SVIDs</tspan><tspan x="1060.00" y="256.00">(X.509 certs or JWTs)</tspan></text>
  <text font-family="sans-serif" font-size="20" fill="rgba(46,134,193,1.00)" text-anchor="start"><tspan x="210.00" y="410.00">SPIRE Agent (per-node)</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(46,134,193,1.00)" text-anchor="start"><tspan x="260.00" y="456.00">Workload Attestor</tspan><tspan x="260.00" y="476.00"></tspan><tspan x="260.00" y="496.00">Verifies process identity</tspan><tspan x="260.00" y="516.00">(kernel metadata, K8s pod, Docker labels)</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(46,134,193,1.00)" text-anchor="start"><tspan x="910.00" y="456.00">Workload API</tspan><tspan x="910.00" y="476.00"></tspan><tspan x="910.00" y="496.00">Unix Domain Socket for credential issuance</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(93,173,226,1.00)" text-anchor="start"><tspan x="310.00" y="666.00">Workload A</tspan><tspan x="310.00" y="686.00"></tspan><tspan x="310.00" y="706.00">spiffe://example.org/service-a</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(93,173,226,1.00)" text-anchor="start"><tspan x="910.00" y="666.00">Workload B</tspan><tspan x="910.00" y="686.00"></tspan><tspan x="910.00" y="706.00">spiffe://example.org/service-b</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(243,156,18,1.00)" text-anchor="start"><tspan x="560.00" y="369.00">1. Node attestation</tspan><tspan x="560.00" y="386.50">   (platform-specific proof)</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(243,156,18,1.00)" text-anchor="start"><tspan x="710.00" y="344.00">2. Node identity verified</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(39,174,96,1.00)" text-anchor="start"><tspan x="200.00" y="584.00">3. Request credentials via</tspan><tspan x="200.00" y="601.50">   Workload API (UDS)</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(243,156,18,1.00)" text-anchor="start"><tspan x="560.00" y="469.00">4. Workload attestation</tspan><tspan x="560.00" y="486.50">   (process verification)</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(39,174,96,1.00)" text-anchor="start"><tspan x="1050.00" y="444.00">5. Request SVID for</tspan><tspan x="1050.00" y="461.50">   workload</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(39,174,96,1.00)" text-anchor="start"><tspan x="1210.00" y="344.00">6. Issue short-lived SVID</tspan><tspan x="1210.00" y="361.50">   (X.509, minutes TTL)</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(39,174,96,1.00)" text-anchor="start"><tspan x="1185.00" y="584.00">7. Deliver SVID</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(39,174,96,1.00)" text-anchor="middle"><tspan x="720.00" y="816.00">8. mTLS using SVIDs</tspan><tspan x="720.00" y="836.00">   (mutual authentication)</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(211,84,0,1.00)" text-anchor="start"><tspan x="110.00" y="904.00">SPIFFE ID format:</tspan><tspan x="110.00" y="921.50"></tspan><tspan x="110.00" y="939.00">spiffe://trust-domain/workload-path</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(211,84,0,1.00)" text-anchor="start"><tspan x="560.00" y="904.00">SVID properties:</tspan><tspan x="560.00" y="921.50"></tspan><tspan x="560.00" y="939.00">Short-lived (minutes), auto-rotated,</tspan><tspan x="560.00" y="956.50">no static secrets</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(26,82,118,1.00)" text-anchor="middle"><tspan x="1200.00" y="915.50">CNCF Graduated</tspan><tspan x="1200.00" y="938.00">(2022)</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(127,140,141,1.00)" text-anchor="start"><tspan x="50.00" y="218.00">Tier 1</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(127,140,141,1.00)" text-anchor="start"><tspan x="50.00" y="478.00">Tier 2</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(127,140,141,1.00)" text-anchor="start"><tspan x="50.00" y="698.00">Tier 3</tspan></text>
</svg>