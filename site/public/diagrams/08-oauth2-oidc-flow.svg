  <text font-family="sans-serif" font-size="20" fill="rgba(28,40,51,1.00)" text-anchor="middle"><tspan x="140.00" y="220.00">User</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(255,255,255,1.00)" text-anchor="middle"><tspan x="540.00" y="145.50">Client App</tspan><tspan x="540.00" y="168.00">SPA/Mobile/Web</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(255,255,255,1.00)" text-anchor="middle"><tspan x="1000.00" y="145.50">Authorization</tspan><tspan x="1000.00" y="168.00">Server (OpenAM)</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(255,255,255,1.00)" text-anchor="middle"><tspan x="1440.00" y="145.50">Resource</tspan><tspan x="1440.00" y="168.00">Server (API)</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(28,40,51,1.00)" text-anchor="middle"><tspan x="330.00" y="258.50">1. Click Login</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(28,40,51,1.00)" text-anchor="middle"><tspan x="540.00" y="327.75">2. PKCE:</tspan><tspan x="540.00" y="345.25">Generate code_verifier</tspan><tspan x="540.00" y="362.75">code_challenge = S256</tspan></text>
  <text font-family="sans-serif" font-size="12" fill="rgba(46,134,193,1.00)" text-anchor="middle"><tspan x="760.00" y="409.50">3. Authorization Request</tspan><tspan x="760.00" y="424.50">GET /authorize?response_type=code</tspan><tspan x="760.00" y="439.50">&amp;client_id=...&amp;code_challenge=...</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(46,134,193,1.00)" text-anchor="middle"><tspan x="550.00" y="478.50">4. Login form</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(28,40,51,1.00)" text-anchor="middle"><tspan x="550.00" y="538.50">5. Credentials</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(46,134,193,1.00)" text-anchor="middle"><tspan x="550.00" y="598.50">6. Consent screen</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(28,40,51,1.00)" text-anchor="middle"><tspan x="540.00" y="658.50">7. Approve</tspan></text>
  <text font-family="sans-serif" font-size="12" fill="rgba(46,134,193,1.00)" text-anchor="middle"><tspan x="770.00" y="709.50">8. Authorization Code</tspan><tspan x="770.00" y="724.50">HTTP 302</tspan><tspan x="770.00" y="739.50">redirect_uri?code=ABC123</tspan></text>
  <text font-family="sans-serif" font-size="11" fill="rgba(142,68,173,1.00)" text-anchor="middle"><tspan x="760.00" y="783.50">9. Token Request</tspan><tspan x="760.00" y="797.25">POST /token</tspan><tspan x="760.00" y="811.00">grant_type=authorization_code</tspan><tspan x="760.00" y="824.75">code=ABC123, code_verifier=...</tspan></text>
  <text font-family="sans-serif" font-size="12" fill="rgba(46,134,193,1.00)" text-anchor="middle"><tspan x="770.00" y="869.50">10. Token Response</tspan><tspan x="770.00" y="884.50">{ access_token, id_token (JWT),</tspan><tspan x="770.00" y="899.50">refresh_token }</tspan></text>
  <text font-family="monospace" font-size="12" fill="rgba(28,40,51,1.00)" text-anchor="start"><tspan x="710.00" y="962.00">JWT id_token:</tspan><tspan x="710.00" y="977.00"></tspan><tspan x="710.00" y="992.00">Header: { &quot;alg&quot;: &quot;RS256&quot;, &quot;kid&quot;: &quot;...&quot; }</tspan><tspan x="710.00" y="1007.00">Payload: {</tspan><tspan x="710.00" y="1022.00">  &quot;iss&quot;: &quot;https://openam.example.com&quot;,</tspan><tspan x="710.00" y="1037.00">  &quot;sub&quot;: &quot;user123&quot;,</tspan><tspan x="710.00" y="1052.00">  &quot;aud&quot;: &quot;client_app&quot;,</tspan><tspan x="710.00" y="1067.00">  &quot;exp&quot;: 1708300000,</tspan><tspan x="710.00" y="1082.00">  &quot;iat&quot;: 1708296400,</tspan><tspan x="710.00" y="1097.00">  &quot;nonce&quot;: &quot;abc123&quot;</tspan><tspan x="710.00" y="1112.00">}</tspan><tspan x="710.00" y="1127.00">Signature: RS256(header + payload, key)</tspan></text>
  <text font-family="sans-serif" font-size="12" fill="rgba(39,174,96,1.00)" text-anchor="middle"><tspan x="980.00" y="1029.50">11. API Call</tspan><tspan x="980.00" y="1044.50">GET /api/resource</tspan><tspan x="980.00" y="1059.50">Authorization: Bearer &lt;access_token&gt;</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(39,174,96,1.00)" text-anchor="middle"><tspan x="980.00" y="1097.75">12. 200 OK + resource data</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(142,68,173,1.00)" text-anchor="middle"><tspan x="330.00" y="1158.50">13. Display result</tspan></text>
  <text font-family="sans-serif" font-size="28" fill="rgba(28,40,51,1.00)" text-anchor="middle"><tspan x="860.00" y="58.00">OAuth 2.0 / OpenID Connect Authorization Code + PKCE Flow</tspan></text>
</svg>