  <text font-family="monospace" font-size="14" fill="rgba(28,40,51,1.00)" text-anchor="start"><tspan x="1310.00" y="624.00">&lt;saml:Assertion&gt;</tspan><tspan x="1310.00" y="641.50">  &lt;saml:Issuer&gt;</tspan><tspan x="1310.00" y="659.00">    https://idp.example.com</tspan><tspan x="1310.00" y="676.50">  &lt;/saml:Issuer&gt;</tspan><tspan x="1310.00" y="694.00">  &lt;saml:Subject&gt;</tspan><tspan x="1310.00" y="711.50">    &lt;saml:NameID&gt;</tspan><tspan x="1310.00" y="729.00">      user@example.com</tspan><tspan x="1310.00" y="746.50">    &lt;/saml:NameID&gt;</tspan><tspan x="1310.00" y="764.00">  &lt;/saml:Subject&gt;</tspan><tspan x="1310.00" y="781.50">  &lt;saml:Conditions</tspan><tspan x="1310.00" y="799.00">    NotBefore=&quot;...&quot;</tspan><tspan x="1310.00" y="816.50">    NotOnOrAfter=&quot;...&quot;&gt;</tspan><tspan x="1310.00" y="834.00">    &lt;saml:AudienceRestriction&gt;</tspan><tspan x="1310.00" y="851.50">      &lt;saml:Audience&gt;</tspan><tspan x="1310.00" y="869.00">        https://sp.example.com</tspan><tspan x="1310.00" y="886.50">      &lt;/saml:Audience&gt;</tspan><tspan x="1310.00" y="904.00">    &lt;/saml:AudienceRestriction&gt;</tspan><tspan x="1310.00" y="921.50">  &lt;/saml:Conditions&gt;</tspan><tspan x="1310.00" y="939.00">&lt;/saml:Assertion&gt;</tspan></text>
  <text font-family="sans-serif" font-size="28" fill="rgba(28,40,51,1.00)" text-anchor="middle"><tspan x="700.00" y="58.00">SAML 2.0 SP-Initiated SSO Flow</tspan></text>
