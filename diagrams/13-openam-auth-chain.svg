  <text font-family="sans-serif" font-size="20" fill="rgba(26,82,118,1.00)" text-anchor="middle"><tspan x="540.00" y="97.50">Client Request</tspan></text>
  <text font-family="sans-serif" font-size="20" fill="rgba(26,82,118,1.00)" text-anchor="middle"><tspan x="540.00" y="247.50">AuthContext.login()</tspan></text>
  <text font-family="sans-serif" font-size="20" fill="rgba(26,82,118,1.00)" text-anchor="middle"><tspan x="540.00" y="395.00">AMLoginContext →</tspan><tspan x="540.00" y="420.00">JAAS LoginContext</tspan></text>
  <text font-family="sans-serif" font-size="24" fill="rgba(46,64,83,1.00)" text-anchor="middle"><tspan x="540.00" y="564.00">Authentication Chain</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(26,82,118,1.00)" text-anchor="middle"><tspan x="330.00" y="670.50">Module 1</tspan><tspan x="330.00" y="693.00"></tspan><tspan x="330.00" y="715.50">LDAP</tspan><tspan x="330.00" y="738.00">Auth</tspan><tspan x="330.00" y="760.50"></tspan><tspan x="330.00" y="783.00">REQUIRED</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(26,82,118,1.00)" text-anchor="middle"><tspan x="550.00" y="670.50">Module 2</tspan><tspan x="550.00" y="693.00"></tspan><tspan x="550.00" y="715.50">HOTP</tspan><tspan x="550.00" y="738.00">(MFA)</tspan><tspan x="550.00" y="760.50"></tspan><tspan x="550.00" y="783.00">REQUIRED</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(26,82,118,1.00)" text-anchor="middle"><tspan x="770.00" y="670.50">Module 3</tspan><tspan x="770.00" y="693.00"></tspan><tspan x="770.00" y="715.50">Device</tspan><tspan x="770.00" y="738.00">Print</tspan><tspan x="770.00" y="760.50"></tspan><tspan x="770.00" y="783.00">OPTIONAL</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(86,101,115,1.00)" text-anchor="middle"><tspan x="540.00" y="866.00">All REQUIRED modules must succeed for chain to pass</tspan></text>
  <text font-family="sans-serif" font-size="20" fill="rgba(26,82,118,1.00)" text-anchor="middle"><tspan x="540.00" y="1015.00">DSAMECallbackHandler</tspan><tspan x="540.00" y="1040.00">handle(Callback[])</tspan></text>
  <text font-family="sans-serif" font-size="20" fill="rgba(26,82,118,1.00)" text-anchor="middle"><tspan x="540.00" y="1185.00">Subject populated with</tspan><tspan x="540.00" y="1210.00">Principals + Credentials</tspan></text>
  <text font-family="sans-serif" font-size="20" fill="rgba(26,82,118,1.00)" text-anchor="middle"><tspan x="540.00" y="1355.00">SessionService</tspan><tspan x="540.00" y="1380.00">.createSession()</tspan></text>
  <text font-family="sans-serif" font-size="20" fill="rgba(20,90,50,1.00)" text-anchor="middle"><tspan x="540.00" y="1522.50">Encrypted SSOToken</tspan><tspan x="540.00" y="1547.50">→ Set as cookie</tspan><tspan x="540.00" y="1572.50">→ Return to Client</tspan></text>
  <text font-family="sans-serif" font-size="22" fill="rgba(125,102,8,1.00)" text-anchor="middle"><tspan x="1140.00" y="562.00">JAAS Control Flags</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(26,82,118,1.00)" text-anchor="start"><tspan x="970.00" y="611.00">REQUIRED: Must succeed;</tspan><tspan x="970.00" y="631.00">continue chain regardless</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(26,82,118,1.00)" text-anchor="start"><tspan x="970.00" y="681.00">REQUISITE: Must succeed;</tspan><tspan x="970.00" y="701.00">fail immediately if not</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(26,82,118,1.00)" text-anchor="start"><tspan x="970.00" y="751.00">SUFFICIENT: If succeeds +</tspan><tspan x="970.00" y="771.00">no prior REQUIRED failures</tspan><tspan x="970.00" y="791.00">→ return success</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(26,82,118,1.00)" text-anchor="start"><tspan x="970.00" y="841.00">OPTIONAL: Success/failure</tspan><tspan x="970.00" y="861.00">doesn&#x27;t matter</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(125,102,8,1.00)" text-anchor="start"><tspan x="970.00" y="953.00">Module Examples</tspan></text>
  <text font-family="sans-serif" font-size="14" fill="rgba(26,82,118,1.00)" text-anchor="start"><tspan x="970.00" y="984.00">OpenAM ships 34+ auth modules:</tspan><tspan x="970.00" y="1001.50">LDAP, Active Directory, HOTP,</tspan><tspan x="970.00" y="1019.00">OATH, OAuth2, OIDC, SAML2,</tspan><tspan x="970.00" y="1036.50">RADIUS, X.509 Cert, WebAuthn,</tspan><tspan x="970.00" y="1054.00">Scripted (Groovy), Adaptive Risk,</tspan><tspan x="970.00" y="1071.50">Device Fingerprinting, etc.</tspan></text>
