  <text font-family="sans-serif" font-size="36" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="1050.00" y="66.00">Token Format Evolution &amp; Lifecycle</tspan></text>
  <text font-family="sans-serif" font-size="28" fill="rgba(30,30,30,1.00)" text-anchor="start"><tspan x="100.00" y="128.00">PART A — Token Format Evolution</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="240.00" y="188.00">1993 — Kerberos</tspan><tspan x="240.00" y="210.50"></tspan><tspan x="240.00" y="233.00">Binary format</tspan><tspan x="240.00" y="255.50">Symmetric key</tspan><tspan x="240.00" y="278.00">encryption</tspan><tspan x="240.00" y="300.50"></tspan><tspan x="240.00" y="323.00">TGT + Service</tspan><tspan x="240.00" y="345.50">Tickets</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="560.00" y="176.75">2005 — SAML</tspan><tspan x="560.00" y="199.25"></tspan><tspan x="560.00" y="221.75">XML digitally</tspan><tspan x="560.00" y="244.25">signed</tspan><tspan x="560.00" y="266.75"></tspan><tspan x="560.00" y="289.25">Verbose</tspan><tspan x="560.00" y="311.75">~2-5KB each</tspan><tspan x="560.00" y="334.25"></tspan><tspan x="560.00" y="356.75">&lt;Assertion&gt;</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="880.00" y="176.75">2015 — JWT</tspan><tspan x="880.00" y="199.25">RFC 7519</tspan><tspan x="880.00" y="221.75"></tspan><tspan x="880.00" y="244.25">JSON compact</tspan><tspan x="880.00" y="266.75">base64url</tspan><tspan x="880.00" y="289.25"></tspan><tspan x="880.00" y="311.75">Header.Payload</tspan><tspan x="880.00" y="334.25">.Signature</tspan><tspan x="880.00" y="356.75">~500 bytes</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="1200.00" y="165.50">2023 — DPoP</tspan><tspan x="1200.00" y="188.00">RFC 9449</tspan><tspan x="1200.00" y="210.50"></tspan><tspan x="1200.00" y="233.00">Proof-of-</tspan><tspan x="1200.00" y="255.50">possession</tspan><tspan x="1200.00" y="278.00"></tspan><tspan x="1200.00" y="300.50">Sender-</tspan><tspan x="1200.00" y="323.00">constrained</tspan><tspan x="1200.00" y="345.50"></tspan><tspan x="1200.00" y="368.00">Prevents theft</tspan></text>
  <text font-family="sans-serif" font-size="18" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="1520.00" y="165.50">2024 — SD-JWT</tspan><tspan x="1520.00" y="188.00">VC</tspan><tspan x="1520.00" y="210.50"></tspan><tspan x="1520.00" y="233.00">Selective</tspan><tspan x="1520.00" y="255.50">disclosure</tspan><tspan x="1520.00" y="278.00"></tspan><tspan x="1520.00" y="300.50">Verifiable</tspan><tspan x="1520.00" y="323.00">Credentials</tspan><tspan x="1520.00" y="345.50"></tspan><tspan x="1520.00" y="368.00">Privacy-first</tspan></text>
  <text font-family="sans-serif" font-size="20" fill="rgba(73,80,87,1.00)" text-anchor="middle"><tspan x="850.00" y="390.00">Binary → XML → JSON → Proof-of-Possession → Selective Disclosure</tspan></text>
  <text font-family="sans-serif" font-size="28" fill="rgba(30,30,30,1.00)" text-anchor="start"><tspan x="100.00" y="498.00">PART B — Token Lifecycle</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="880.00" y="556.00">Issuance</tspan><tspan x="880.00" y="576.00"></tspan><tspan x="880.00" y="596.00">AuthZ server</tspan><tspan x="880.00" y="616.00">creates token</tspan><tspan x="880.00" y="636.00">(signing, encryption)</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="1240.00" y="696.00">Transmission</tspan><tspan x="1240.00" y="716.00"></tspan><tspan x="1240.00" y="736.00">Authorization header</tspan><tspan x="1240.00" y="756.00">cookie</tspan><tspan x="1240.00" y="776.00">form POST</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="890.00" y="831.00">Validation</tspan><tspan x="890.00" y="851.00"></tspan><tspan x="890.00" y="871.00">Signature check</tspan><tspan x="890.00" y="891.00">expiration, audience</tspan><tspan x="890.00" y="911.00">introspection</tspan><tspan x="890.00" y="931.00">(RFC 7662)</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="540.00" y="836.00">Storage</tspan><tspan x="540.00" y="856.00"></tspan><tspan x="540.00" y="876.00">CTS, Redis</tspan><tspan x="540.00" y="896.00">browser</tspan><tspan x="540.00" y="916.00">localStorage</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="240.00" y="691.00">Refresh</tspan><tspan x="240.00" y="711.00"></tspan><tspan x="240.00" y="731.00">Token exchange</tspan><tspan x="240.00" y="751.00">(RFC 8693)</tspan><tspan x="240.00" y="771.00">refresh_token</tspan><tspan x="240.00" y="791.00">grant</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="240.00" y="551.00">Revocation</tspan><tspan x="240.00" y="571.00"></tspan><tspan x="240.00" y="591.00">Blacklist</tspan><tspan x="240.00" y="611.00">CTS deletion</tspan><tspan x="240.00" y="631.00">/revoke endpoint</tspan><tspan x="240.00" y="651.00">(RFC 7009)</tspan></text>
  <text font-family="sans-serif" font-size="16" fill="rgba(30,30,30,1.00)" text-anchor="middle"><tspan x="540.00" y="556.00">Destruction</tspan><tspan x="540.00" y="576.00"></tspan><tspan x="540.00" y="596.00">Session timeout</tspan><tspan x="540.00" y="616.00">logout</tspan><tspan x="540.00" y="636.00">cleanup</tspan></text>
